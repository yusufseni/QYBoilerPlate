{#include base.html}
    {#title}Login{/title}

    {#content}
        <div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
            <form action="/login" method="post" class="p-4 rounded shadow" style="background-color:#1e1e1e; width: 100%; max-width: 400px;">
                <h1 class="text-center mb-4" style="color:#f0ad4e;">Login</h1>

                {#if flash && flash.type && flash.text}
                    <div class="alert alert-{flash.type.name().toLowerCase()}">
                        {flash.text}
                    </div>
                {/if}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn w-100" style="background-color:#f0ad4e; color:#121212;">Login</button>

                <p class="text-center mt-3" style="color:#f5f5f5;">
                    Belum punya akun? <a href="/registration" style="color:#ffd700;">Daftar</a>
                </p>
            </form>
        </div>
    {/content}

    {#scripts}
        <script>
            console.log("Login page loaded");
        </script>
    {/scripts}
{/include}
