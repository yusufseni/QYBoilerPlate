{#include base.html}
    {#title}Login{/title}

    {#content}
        <!-- Form Login -->
        <form action="/login" method="post" class="p-4 rounded shadow position-relative"
              style="background-color:rgba(30,30,30,0.85); width: 100%; max-width: 400px; border: 2px solid #f0ad4e; z-index: 2;">
            <h3 class="text-center mb-4" style="color:#f0ad4e;">Login</h3>

            {#if flash && flash.type && flash.text}
                <div class="alert alert-{flash.type.name().toLowerCase()}">
                    {flash.text}
                </div>
            {/if}

            <div class="mb-3">
                <label for="username" class="form-label" style="color:#f5f5f5;">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label" style="color:#f5f5f5;">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn w-100" style="background-color:#f0ad4e; color:#121212;">Login</button>

            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn btn-outline-primary w-50">
                    Facebook
                </button>
                <button type="button" class="btn btn-outline-danger w-50">
                    Google
                </button>
            </div>

            <p class="text-center mt-3" style="color:#f5f5f5;">
                Belum punya akun? <a href="/registration" class="text-warning">Daftar</a>
            </p>
        </form>
    {/content}

    {#scripts}
        <style>
            /* Add any custom styles for the login page here */
        </style>

        <script>
            console.log("Login page loaded");
        </script>
    {/scripts}
{/include}
