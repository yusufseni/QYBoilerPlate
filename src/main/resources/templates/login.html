{#include base.html}
    {#title}Login{/title}

    {#content}
        <!-- Form Login -->
        <form action="/login" method="post" class="p-4 rounded shadow position-relative"
              style="background-color:rgba(30,30,30,0.85); width: 100%; max-width: 400px; border: 2px solid #f0ad4e; z-index: 2;">
            <h1 class="text-center mb-4" style="color:#f0ad4e;">Login</h1>

            {#if flash && flash.type && flash.text}
                <div class="alert alert-{flash.type.name().toLowerCase()}">
                    {flash.text}
                </div>
            {/if}

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn w-100" style="background-color:#f0ad4e; color:#121212;">Login</button>

            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn btn-outline-primary w-50">
                    Facebook
                </button>
                <button type="button" class="btn btn-outline-danger w-50">
                    Google
                </button>
            </div>

            <p class="text-center mt-3">
                Belum punya akun? <a href="/registration" class="text-warning">Daftar</a>
            </p>
        </form>
    {/content}

    {#scripts}
        <style>
            body {
                margin: 0;
                height: 100vh;
                font-family: Arial, sans-serif;
                background: url("https://cdn.pixabay.com/photo/2011/12/13/17/07/earth-11048_960_720.jpg") repeat-x;
                background-size: cover;
                animation: earth-spin 60s linear infinite;
                position: relative;
            }

            @keyframes earth-spin {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -2000px 0;
                }
            }

            /* Overlay hitam biar form lebih jelas */
            body::after {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                z-index: 0;
            }
        </style>

        <script>
            console.log("Login page loaded");
        </script>
    {/scripts}
{/include}
