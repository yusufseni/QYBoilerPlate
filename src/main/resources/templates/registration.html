<!-- registration.html -->
{#include base.html}
    {#title}Registration{/title}

    {#content}
        <form action="/registration" method="post"
              class="p-5 rounded shadow position-relative"
              style="background-color:rgba(30,30,30,0.85); width: 100%; max-width: 500px; border: 2px solid #f0ad4e; z-index: 2;">

            <h3 class="text-center mb-4" style="color:#f0ad4e; font-family: 'Orbitron', sans-serif;">Create Account</h3>

            {#if flash && flash.type && flash.text}
                <div class="alert alert-{flash.type.name().toLowerCase()}">
                    {flash.text}
                </div>
            {/if}

            <div class="row">
                <div class="mb-3 col-md-12">
                    <label for="organizationType" class="form-label" style="color:#f5f5f5;">Organization Type</label>
                    <select id="organizationType" name="organizationType" class="form-control" required style="text-transform: capitalize;">
                        <option value="">Select organization type</option>
                        {#for orgType in organizationTypes}
                            <option value="{orgType.name}">{orgType.name.replace('_', ' ').toLowerCase()}</option>
                        {/for}
                    </select>
                </div>

                <div class="mb-3 col-md-6">
                    <label for="username" class="form-label" style="color:#f5f5f5;">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label" style="color:#f5f5f5;">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3 col-md-6">
                    <label for="password" class="form-label" style="color:#f5f5f5;">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3 col-md-6">
                    <label for="firstName" class="form-label" style="color:#f5f5f5;">First Name</label>
                    <input type="text" id="firstName" name="firstName" class="form-control">
                </div>
                <div class="mb-3 col-md-6">
                    <label for="lastName" class="form-label" style="color:#f5f5f5;">Last Name</label>
                    <input type="text" id="lastName" name="lastName" class="form-control">
                </div>
                <div class="mb-3 col-md-6">
                    <label for="phoneNumber" class="form-label" style="color:#f5f5f5;">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn w-100" style="background-color:#f0ad4e; color:#121212; font-weight:bold;">Register</button>

            <p class="text-center mt-3" style="color:#f5f5f5;">
                Already have an account? <a href="/login" style="color:#ffd700;">Login</a>
            </p>
        </form>
    {/content}

    {#scripts}
        <style>
        </style>
    {/scripts}
{/include}
