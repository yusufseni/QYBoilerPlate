<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{#insert title}Ifighter - Professional Fighter Platform{/insert}</title>

    <link rel="icon" type="image/x-icon" href="/ifighter.png">
    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/css/style.css">

    {#insert headContent}{/insert}
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg"
     style="background-color:#121212; border-bottom:2px solid #f0ad4e; z-index:2;">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning d-none d-lg-block navbar-ilogo" href="/">Ifighter</a>

        <!-- Toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!-- Non-authenticated menu -->
                <li class="nav-item">
                    <a class="nav-link text-light hover-gold" href="/login">Login</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-light hover-gold" href="#" id="registerDropdown" role="button" data-bs-toggle="dropdown">
                        Register
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="/registration">As an Organization</a></li>
                        <li><a class="dropdown-item" href="/fighter/registration">As Fighter</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CSS tambahan -->
<style>
    .hover-gold:hover {
        color: #f0ad4e !important;
        transition: color 0.3s ease-in-out;
    }
</style>


<!-- Main Content -->
<main class="flex-grow-1 container my-4">
    {#insert content}{/insert}
</main>

<!-- Footer -->
<footer class="text-center py-3 mt-auto border-top">
    <div class="container">
        <small class="text-muted">&copy; 2025 Ifighter</small>
    </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

{#insert scripts}{/insert}

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const flash = document.querySelector(".alert");
        if (flash) {
            setTimeout(() => {
                flash.classList.add("flash-hide");
                setTimeout(() => flash.remove(), 800); // hapus dari DOM
                console.info("Flash message dismissed");
            }, 4000); // tampil 4 detik
        }
    });
</script>

</body>
</html>
