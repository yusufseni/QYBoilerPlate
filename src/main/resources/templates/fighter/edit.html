<!-- fighter/edit.html -->
{#include base.html}
    {#title}Edit Fighter Profile{/title}

    {#content}
        <div class="container position-relative" style="z-index:2;">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    {#if flash && flash.type && flash.text}
                        <div class="alert alert-{flash.type.name().toLowerCase()}">
                            {flash.text}
                        </div>
                    {/if}

                    <form method="post" action="/fighter/edit" class="fighter-edit-form">
                        <div class="text-center mb-4">
                            <h1 style="color:#f0ad4e; font-family: 'Orbitron', sans-serif;">Edit Fighter Profile</h1>
                            <p class="text-light">Update your fighter information</p>
                        </div>

                        <!-- Basic Info -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="firstName" class="form-label text-light">First Name</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" required value="{fighter.firstName}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="lastName" class="form-label text-light">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" required value="{fighter.lastName}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label text-light">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required value="{fighter.username}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-light">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required value="{fighter.email}">
                        </div>

                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label text-light">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" value="{fighter.phoneNumber}">
                        </div>

                        <!-- Fighter Specific Info -->
                        <hr class="my-4" style="border-color: #f0ad4e;">
                        <h5 class="text-warning mb-3">Fighter Information</h5>

                        <div class="mb-3">
                            <label for="fightName" class="form-label text-light">Fight Name</label>
                            <input type="text" class="form-control" id="fightName" name="fightName" value="{fighter.fightName}">
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="primaryDiscipline" class="form-label text-light">Primary Discipline</label>
                                    <select class="form-control" id="primaryDiscipline" name="primaryDiscipline" required>
                                        <option value="">Select Discipline</option>
                                        <option value="MMA" {fighter.primaryDiscipline == 'MMA' ? 'selected' : ''}>MMA</option>
                                        <option value="Boxing" {fighter.primaryDiscipline == 'Boxing' ? 'selected' : ''}>Boxing</option>
                                        <option value="Muay Thai" {fighter.primaryDiscipline == 'Muay Thai' ? 'selected' : ''}>Muay Thai</option>
                                        <option value="Brazilian Jiu-Jitsu" {fighter.primaryDiscipline == 'Brazilian Jiu-Jitsu' ? 'selected' : ''}>Brazilian Jiu-Jitsu</option>
                                        <option value="Karate" {fighter.primaryDiscipline == 'Karate' ? 'selected' : ''}>Karate</option>
                                        <option value="Taekwondo" {fighter.primaryDiscipline == 'Taekwondo' ? 'selected' : ''}>Taekwondo</option>
                                        <option value="Kickboxing" {fighter.primaryDiscipline == 'Kickboxing' ? 'selected' : ''}>Kickboxing</option>
                                        <option value="Wrestling" {fighter.primaryDiscipline == 'Wrestling' ? 'selected' : ''}>Wrestling</option>
                                        <option value="Judo" {fighter.primaryDiscipline == 'Judo' ? 'selected' : ''}>Judo</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="weightClass" class="form-label text-light">Weight Class</label>
                                    <select class="form-control" id="weightClass" name="weightClass">
                                        <option value="">Select Weight Class</option>
                                        <option value="Strawweight" {fighter.weightClass == 'Strawweight' ? 'selected' : ''}>Strawweight</option>
                                        <option value="Flyweight" {fighter.weightClass == 'Flyweight' ? 'selected' : ''}>Flyweight</option>
                                        <option value="Bantamweight" {fighter.weightClass == 'Bantamweight' ? 'selected' : ''}>Bantamweight</option>
                                        <option value="Featherweight" {fighter.weightClass == 'Featherweight' ? 'selected' : ''}>Featherweight</option>
                                        <option value="Lightweight" {fighter.weightClass == 'Lightweight' ? 'selected' : ''}>Lightweight</option>
                                        <option value="Welterweight" {fighter.weightClass == 'Welterweight' ? 'selected' : ''}>Welterweight</option>
                                        <option value="Middleweight" {fighter.weightClass == 'Middleweight' ? 'selected' : ''}>Middleweight</option>
                                        <option value="Light Heavyweight" {fighter.weightClass == 'Light Heavyweight' ? 'selected' : ''}>Light Heavyweight</option>
                                        <option value="Heavyweight" {fighter.weightClass == 'Heavyweight' ? 'selected' : ''}>Heavyweight</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="gym" class="form-label text-light">Gym/Team</label>
                            <input type="text" class="form-control" id="gym" name="gym" value="{fighter.gym}">
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label text-light">Bio</label>
                            <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="Tell us about yourself...">{fighter.bio}</textarea>
                        </div>

                        <button type="submit" class="btn w-100 mt-3" style="background-color:#f0ad4e; color:#121212; font-weight:bold;">
                            Save Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    {/content}

    {#scripts}
        <style>
            .fighter-edit-form {
                background-color: rgba(30,30,30,0.95);
                padding: 2.5rem;
                border-radius: 12px;
                box-shadow: 0 0 25px rgba(240, 173, 78, 0.3);
                border: 2px solid #f0ad4e;
                max-width: none;
            }
        </style>
    {/scripts}
{/include}
